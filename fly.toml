app = "youtube-cleaner"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_PATH = "/tmp/kids_guardian.log"
  CLEAN_LOG_PATH = "/tmp/cleaning_log.json"
  EDU_LOG_PATH = "/tmp/educational_log.json"
  GOOGLE_CREDENTIALS_FILE = "credentials.json"
  GOOGLE_TOKEN_FILE = "token.json"

[processes]
  worker = "sh -c 'printf \"%s\" \"$GOOGLE_CREDENTIALS_JSON\" > credentials.json && printf \"%s\" \"$GOOGLE_TOKEN_JSON\" > token.json && touch .env && python main_guardian.py'"
